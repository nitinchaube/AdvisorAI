name: Deploy Frontend (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - 'AdvisorAI-Web/frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build Vite app and deploy to live channel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdvisorAI-Web/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: AdvisorAI-Web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Firebase Hosting (live channel)
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project advisoraii \
            --non-interactive
