name: Deploy Backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'AdvisorAI-Web/backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE: advisorai-backend
  JOB: advisorai-scraper
  REPO: advisorai
  IMAGE_HOST: us-east1-docker.pkg.dev
  IMAGE_PATH: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/advisorai/backend
  RUNTIME_SA: advisorai-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    name: Build, push image, deploy service + update job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdvisorAI-Web/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $IMAGE_HOST --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: AdvisorAI-Web/backend
          file: AdvisorAI-Web/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PATH }}:${{ github.sha }}
            ${{ env.IMAGE_PATH }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PATH }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PATH }}:buildcache,mode=max

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE_PATH:${{ github.sha }}" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --service-account="$RUNTIME_SA" \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=80 \
            --timeout=300 \
            --port=8080 \
            --cpu-throttling \
            --execution-environment=gen2 \
            --set-env-vars="^@^FLASK_ENV=production@GOOGLE_CLOUD_PROJECT=$PROJECT_ID@FRONTEND_URL=https://advisoraii.web.app@CORS_ORIGINS=https://advisoraii.web.app,https://advisoraii.firebaseapp.com@LLM_PROVIDER=openai@GEMINI_MODEL=gemini-2.5-flash-lite@OPENAI_MODEL=gpt-4o-mini@VECTORDB_DIR=./VectorDB_v2@EMBEDDING_MODEL=BAAI/bge-small-en-v1.5@TOP_K_PER_COLLECTION=5@MAX_TOTAL_DOCS=5@REFLECTION_ENABLED=true@REFLECTION_THRESHOLD=7@WEB_SEARCH_ENABLED=true@WEB_SEARCH_RESULTS=3@WEB_CONTENT_MAX_CHARS=3000@MEMORY_TYPE=in_memory@MAX_CONCURRENT_TOOLS=3@JOBS_CSV_PATH=jobs.csv@INTERNSHIPS_CSV_PATH=internships.csv@UPLOAD_DIR=uploads@SCRAPER_ENABLED=false@JWT_ACCESS_TOKEN_EXPIRES_HOURS=24@LOG_LEVEL=INFO" \
            --set-secrets="GEMINI_API_KEY=gemini_api_key:latest,OPENAI_API_KEY=openai_api_key:latest,ANTHROPIC_API_KEY=anthropic_api_key:latest,SERPAPI_API_KEY=serpapi_api_key:latest,MONGO_URI=mongo_uri:latest,SECRET_KEY=secret_key:latest,JWT_SECRET_KEY=jwt_secret_key:latest"

      - name: Update Cloud Run Job (scraper) image — only if Job already exists
        run: |
          if gcloud run jobs describe "$JOB" --region="$REGION" >/dev/null 2>&1; then
            echo "Job $JOB exists — updating image to ${{ github.sha }}"
            gcloud run jobs update "$JOB" \
              --image="$IMAGE_PATH:${{ github.sha }}" \
              --region="$REGION"
          else
            echo "Job $JOB does not exist yet — skipping. Run the 'Bootstrap scraper job' workflow first."
          fi

      - name: Show service URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')
          echo "Service URL: $URL"
          echo "service_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')
          for i in 1 2 3 4 5; do
            echo "Health check attempt $i..."
            if curl -fsS --max-time 30 "$URL/" >/dev/null 2>&1 || curl -fsS --max-time 30 "$URL/api/health" >/dev/null 2>&1; then
              echo "Service is responding."
              exit 0
            fi
            sleep 10
          done
          echo "WARNING: Service did not respond to a health check, but deploy succeeded. Verify manually."
