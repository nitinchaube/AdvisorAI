version: '3.8'
networks:
  backend_advisorai_network:
    external: true  # Use the external network created by backend


services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5003/api
    container_name: advisorai_frontend
    ports:
      - "3000:80"
    networks:
      - backend_advisorai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3