services:
  - type: web
    name: advisorai-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: /app
      - key: DATA_DIR
        value: /app/Data
      - key: VECTORDB_DIR
        value: /app/VectorDB
      - key: UPLOADS_DIR
        value: /app/uploads
      - key: FIREBASE_CREDENTIALS_PATH
        value: /app/firebae_key1.json
      - key: COURSE_DATA_FILE
        value: AllCourseRelatedData.json
      - key: FACULTY_GENERAL_DATA_FILE
        value: AllFacultyGeneralInformation.json
      - key: FACULTY_RESEARCH_DATA_FILE
        value: AllFacultyResearchInformation.json
      - key: JOBS_CSV_FILE
        value: jobs.csv
      - key: INTERNSHIPS_CSV_FILE
        value: internships.csv
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: TOP_K_PER_COLLECTION
        value: 5
      - key: MAX_TOTAL_DOCS
        value: 5
      - key: WEB_SEARCH_ENABLED
        value: true
      - key: WEB_SEARCH_RESULTS
        value: 3
      - key: MEMORY_TYPE
        value: in_memory
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: MAX_CONCURRENT_TOOLS
        value: 3

  - type: redis
    name: advisorai-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru