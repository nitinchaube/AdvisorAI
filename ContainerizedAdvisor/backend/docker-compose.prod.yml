version: '3.8'

networks:
  advisorai_network:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: advisorai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - advisorai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: advisorai_backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DATA_DIR=/app/Data
      - VECTORDB_DIR=/app/VectorDB
      - UPLOADS_DIR=/app/uploads
      - COURSE_DATA_FILE=AllCourseRelatedData.json
      - FACULTY_GENERAL_DATA_FILE=AllFacultyGeneralInformation.json
      - FACULTY_RESEARCH_DATA_FILE=AllFacultyResearchInformation.json
      - JOBS_CSV_FILE=jobs.csv
      - INTERNSHIPS_CSV_FILE=internships.csv
      - FIREBASE_CREDENTIALS_PATH=/app/firebae_key1.json
    volumes:
      - ./uploads:/app/uploads
      - ./VectorDB:/app/VectorDB
      - ./Data:/app/Data
      - ./firebae_key1.json:/app/firebae_key1.json:ro
    networks:
      - advisorai_network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
    driver: local
